  SampleIDStatus: FROZEN
  OutputDir: ${OUTPUT_ROOT}/M01-F0-W9/M01-F0-W9-S01/R01/
  ExecutionStatus: NOT_STARTED
  FaultType: Targeted TLBI invalidation suppression / stale translation
  TargetInstruction: TLBI VALE1IS and any later matching range TLBI (e.g. RVAE1IS);
    then target LDR.
  EligibleEventCondition: TLBInstance=l2_shared; tlbi_op.match=true; te.valid=true;
    te.partial=false; exact VA/ASID/VMID/regime/security/type key.
  ExpectedPropagationPath: TLBI issue -> l2_shared match -> suppress invalidation
    -> DTLB miss -> stale L2 hit -> DTLB refill -> old PA -> LSU/cache/memory -> Load/consumer
    -> commit/oracle.
  ExpectedTerminalStates: SDC, ACTIVATED_MASKED, SQUASHED, DETECTED_CONTAINED (if
    downstream fault blocks), CRASH, HANG/TIMEOUT.
  OracleMethod: 'W9: new PA2 marker 0x55 is golden; old PA1 marker 0xAA indicates
    stale mapping only when trace proves stale L2 entry was consumed.'
  SeedPolicy: DETERMINISTIC
  SeedSource: RESEARCHER_APPROVED
  SampleFreezeStatus: FROZEN
