            status: done-local
            evidence: commit e5eecbb
          - id: g3
            short: G3 cache 接口
            title: cache 安全访问接口
            status: done-local
            evidence: commit ea6b192
          - id: g4
            short: G4 内存
            title: CHAOSMem 权重与边界正确性
            status: done-local
            evidence: commit 9870e9f
          - id: g5
            short: G5 单故障
