  <!-- SVE/SME 卡（独有） -->
  <g>
    <rect x="812" y="176" width="330" height="120" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
    <text x="824" y="198" font-size="13" font-weight="700" fill="#92400e">★ SVE 512-bit + SME/SME2（五款中唯一）</text>
    <text x="824" y="220" font-size="11" fill="#334155">· SVEver=1 · f32mm/f64mm/BF16=1 · 实测 VL=64B</text>
    <text x="824" y="237" font-size="11" fill="#334155">· SME2：f64f64/b16f32/f32f32/i8i32（fa64=0）</text>
    <text x="824" y="258" font-size="11" font-weight="600" fill="#b91c1c">· Z0–Z31 × 512b + 矩阵 tile = 新增大面积无保护数据面</text>
    <text x="824" y="280" font-size="10.5" fill="#6b7280">· SVE512 FMA 实测 ≥13.6 flop/cyc（理论 16）</text>
  </g>

  <!-- ISA 卡 -->
  <g>
    <rect x="1182" y="176" width="248" height="120" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.8"/>
    <text x="1306" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">ISA 扩展（实测）</text>
    <text x="1194" y="220" font-size="10.5" fill="#334155">SHA1/2/512 · SHA3 · SM3/SM4 · LRCPC2/3</text>
    <text x="1194" y="237" font-size="10.5" fill="#334155">i8mm · bf16 · RPRES · WFXT · SVE2 全集</text>
    <text x="1194" y="258" font-size="10.5" font-weight="600" fill="#b91c1c">BTI=0 · MTE=0 · RNDR=0</text>
    <text x="1194" y="280" font-size="10.5" fill="#6b7280">AES+PMULL · CRC32 · LSE</text>
  </g>

  <!-- ============ 后端泳道 ============ -->
  <rect x="30" y="380" width="1420" height="330" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="46" y="406" font-size="15" font-weight="700" fill="#c2410c">后端（乱序 · 吞吐实测）</text>
  <text x="250" y="406" font-size="11.5" fill="#9a3412">标量 FMA 2/cyc · NEON128 FMA 2/cyc · SVE512 FMA ≥2/cyc——三级向量吞吐阶梯全部双发</text>

  <g>
    <rect x="50" y="426" width="300" height="130" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
    <text x="200" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">标量/NEON 通路</text>
    <text x="62" y="472" font-size="10.5" fill="#334155">· 标量 FMADD 8 链：8.0 Gflop/s = 4 flop/cyc</text>
    <text x="62" y="489" font-size="10.5" fill="#334155">· NEON128 8×2lane：13.5 Gflop/s ≈ 6.75</text>
    <text x="62" y="509" font-size="10.5" font-weight="600" fill="#b91c1c">· 标量 FMA 双端口实证（920 为 FP 单口怪点）</text>
    <text x="62" y="529" font-size="10.5" fill="#6b7280">· 单核理论 128 Gflop/s（SVE512 FP64）</text>
  </g>

  <g>
    <rect x="390" y="426" width="300" height="130" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
    <text x="540" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">★ SVE512 数据通路</text>
    <text x="402" y="472" font-size="10.5" fill="#334155">· SVE512 8×8lane：27.2 Gflop/s 下限（~13.6）</text>
    <text x="402" y="489" font-size="10.5" fill="#334155">· 608 核节点理论 ~77.8 Tflop/s（FP64）</text>
    <text x="402" y="509" font-size="10.5" font-weight="600" fill="#b91c1c">· 单向量翻转影响 64B 连续数据</text>
    <text x="402" y="529" font-size="10.5" fill="#6b7280">· flopbench 修正版待复测（初版被编译器削链）</text>
  </g>

  <g>
    <rect x="730" y="426" width="300" height="130" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="880" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280">PRF/ROB/调度器（未公开）</text>
    <text x="742" y="472" font-size="10.5" fill="#6b7280">· 容量/结构黑盒</text>
    <text x="742" y="489" font-size="10.5" font-weight="600" fill="#b91c1c">· 与五款一致：无任何保护披露</text>
    <text x="742" y="509" font-size="10.5" fill="#6b7280">· FI 实验按 gem5 O3 通用模型注入</text>
  </g>

  <!-- LSU -->
  <g>
    <rect x="50" y="590" width="620" height="100" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
    <text x="70" y="614" font-size="13" font-weight="700" fill="#9a3412">LSU / 访存</text>
    <text x="70" y="636" font-size="10.5" fill="#334155">· LSE 原子 · LRCPC2/3（LDAPR 系增强）· DC ZVA 64B</text>
    <text x="70" y="656" font-size="10.5" font-weight="600" fill="#b91c1c">· LSQ/store buffer 保护未披露（五款共同盲区）</text>
    <text x="70" y="676" font-size="10.5" fill="#6b7280">· 定频 2.0GHz（userspace 锁 MAX）→ 测量无变频噪声</text>
  </g>

  <!-- PMU/SPE -->
  <g>
    <rect x="730" y="590" width="300" height="100" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
    <text x="880" y="614" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a3412">PMUv3（6 计数器）+ SPE</text>
    <text x="880" y="636" text-anchor="middle" font-size="10.5" fill="#334155">AMU=1（活动监视）· DIT=1</text>
    <text x="880" y="656" text-anchor="middle" font-size="10.5" fill="#6b7280">SPE：每指令统计画像</text>
    <text x="880" y="676" text-anchor="middle" font-size="10.5" fill="#6b7280">（920 无 SPE，920f 补齐）</text>
  </g>

  <!-- ============ 内存+MMU 泳道 ============ -->
  <rect x="30" y="730" width="1420" height="270" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="46" y="756" font-size="15" font-weight="700" fill="#047857">内存层级 + MMU</text>
  <text x="200" y="756" font-size="11.5" fill="#065f46">16 计算 NUMA + 16 无 CPU 内存节点（疑似 CXL/近存）· 跨 socket 距离 61–91 · 8×200GbE RoCE 聚合 1.6Tb/s</text>

  <g font-size="11">
    <rect x="60" y="776" width="210" height="140" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
    <text x="165" y="798" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">L1D 32KB 8-way</text>
    <text x="165" y="816" text-anchor="middle" fill="#334155">64B 行 · 实测 ~5.0ns（≈10c）</text>
    <text x="165" y="833" text-anchor="middle" fill="#334155">★ 8-way（同代 Neoverse 为 4-way）</text>
    <text x="165" y="853" text-anchor="middle" fill="#6b7280">ECC 未披露</text>
    <text x="165" y="876" text-anchor="middle" fill="#6b7280">容量 32KB &lt; 920 的 64KB</text>

    <rect x="330" y="776" width="230" height="140" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
    <text x="445" y="798" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">★ L2 768KB 12-way 私有</text>
    <text x="445" y="816" text-anchor="middle" fill="#334155">统一 I+D · 实测 ~8.7ns（≈17c）</text>
    <text x="445" y="833" text-anchor="middle" fill="#334155">非常规容量/相联度（N 系 L2 可配 512KB–2MB，默认 512KB/1MB）</text>
    <text x="445" y="853" text-anchor="middle" fill="#6b7280">12-way 非常规（920:8 / N 系:8）</text>
    <text x="445" y="876" text-anchor="middle" fill="#6b7280">ECC 未披露</text>

    <rect x="620" y="776" width="230" height="140" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="735" y="798" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">★ 无 L3 / LLC</text>
    <text x="735" y="816" text-anchor="middle" fill="#334155">sysfs 无 index3 · CLIDR 陷阱实证</text>
    <text x="735" y="833" text-anchor="middle" fill="#334155">SCN 网状远端 8–16MB → 45–90ns</text>
    <text x="735" y="853" text-anchor="middle" fill="#334155">（网络侧缓存，非核侧 LLC）</text>
    <text x="735" y="876" text-anchor="middle" font-weight="600" fill="#b91c1c">少一级缓存 = 少一级 SDC 暴露面</text>

    <rect x="910" y="776" width="210" height="140" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
    <text x="1015" y="798" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">DRAM / NUMA</text>
    <text x="1015" y="816" text-anchor="middle" fill="#334155">565GB · 16×31–33GB 计算节点</text>
    <text x="1015" y="833" text-anchor="middle" fill="#334155">远程 NUMA 实测 ~130ns</text>
    <text x="1015" y="853" text-anchor="middle" fill="#334155">node16–31 无 CPU 各 4GB</text>
    <text x="1015" y="876" text-anchor="middle" fill="#6b7280">（性质待确认：CXL? HBM?）</text>
  </g>
  <line x1="270" y1="846" x2="324" y2="846" stroke="#059669" stroke-width="2.5" marker-end="url(#arwG)"/>
  <line x1="560" y1="846" x2="614" y2="846" stroke="#059669" stroke-width="2.5" marker-end="url(#arwG)"/>
  <line x1="850" y1="846" x2="904" y2="846" stroke="#059669" stroke-width="2.5" marker-end="url(#arwG)"/>

  <g>
    <rect x="1160" y="776" width="270" height="140" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="1295" y="798" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">MMU：TLB + PTW</text>
    <text x="1172" y="818" font-size="10.5" fill="#334155">· TLB 容量未测（缺口，待补）</text>
    <text x="1172" y="835" font-size="10.5" font-weight="600" fill="#b91c1c">★ 仅 64KB 页（TGran4=0xf 强制）</text>
    <text x="1172" y="855" font-size="10.5" font-weight="600" fill="#b91c1c">· 单 TLB entry 翻转波及面 ×16</text>
    <text x="1172" y="875" font-size="10.5" fill="#6b7280">　（vs 4KB 页）——SDC 放大器</text>
    <text x="1172" y="895" font-size="10.5" fill="#6b7280">· PAGESIZE=4096 是内核兼容层假象</text>
  </g>

  <!-- RAS 横幅 -->
  <g>
    <rect x="30" y="1020" width="1420" height="120" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
    <text x="46" y="1048" font-size="14" font-weight="700" fill="#92400e">★ RAS 状况：ID_AA64PFR0_EL1.RAS = 1（实测）—— 有 ARMv8.2+ RAS 架构扩展，但防御矩阵黑盒</text>
    <text x="46" y="1072" font-size="11.5" fill="#334155">· 与 920（RAS=0）的关键代差：ERR* 寄存器 / ESB / 架构化 poison 理论上存在 · 具体注入寄存器布局未知（无厂商 TRM）</text>
    <text x="46" y="1092" font-size="11.5" fill="#334155">· DIT=1（数据无关时间）· CSV2/3=1 · AMU=1 · 无 MTE（内存标签纠错不可用）</text>
    <text x="46" y="1114" font-size="11.5" fill="#334155">· uncore 观测：171 perf 设备 = 8 SCCL×(4 DDRC+4 HHA+16 UC) + 14 SICL L3(hisi_sicl3_pa/h60pa) + SPE + PCIe PTT</text>
    <text x="46" y="1134" font-size="11" font-weight="600" fill="#b45309">· SDC 实验定位：RAS=1 但无文档 → "有防御潜力但强度未知"；64KB 页 × TLB 注入是未被文献覆盖的放大器实验</text>
  </g>

  <!-- 未决项卡 -->
  <g>
    <rect x="30" y="1150" width="1420" height="96" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="46" y="1176" font-size="12.5" font-weight="700" fill="#6b7280">未决项（920f.md §7 原文，诚实记录）</text>
    <text x="46" y="1198" font-size="11" fill="#6b7280">· SVE512 峰值复测（修正版 flopbench 已写好，等节点空闲）· 分支预测器容量（bpbench 中断过）· node16–31 无 CPU 内存节点性质（CXL? HBM?，需 ddrc PMU 或 dmesg root）</text>
    <text x="46" y="1220" font-size="11" fill="#6b7280">· 隔离：isolcpus + nohz_full 覆盖 608 核，每 NUMA 留末核处理中断（FI 实验绑核须避开）</text>
    <text x="46" y="1240" font-size="10.5" fill="#9ca3af">复现入口：dnode -l cn23154 / dattach -c '/home/share/suke/archprobe/...'（详见 920f.md §6）</text>
  </g>

  <text x="30" y="1282" font-size="10.5" fill="#9ca3af">图 920f-1：920f（HiSilicon 0xd22）微架构功能图 · ★=独有/标志性 · 红色=SDC 高危 · 灰虚线=未公开 · 实测出处：920f.md（NSCC cn23154）· 与 microarchitecture-sdc-sensitivity.md §3–§9 对应</text>
</svg>
