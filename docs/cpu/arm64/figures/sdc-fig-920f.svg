  <rect x="0" y="0" width="1480" height="1300" fill="#ffffff"/>

  <text x="30" y="34" font-size="21" font-weight="700" fill="#111827">920f · HiSilicon part 0xd22（未发布新一代 Taishan）微架构功能图（ARMv9 · 黑盒实测）</text>
  <text x="30" y="56" font-size="12.5" fill="#6b7280">★ 金粗边框 = 独有/标志性 · 红色 = SDC 高危 · 灰虚线框 = 未公开（黑盒，无 TRM） · 实测于 NSCC cn23154（2S×304 核 = 608 核 · 2.0GHz 定频 · Kylin V10）</text>

  <g font-size="11.5">
    <rect x="30" y="70" width="760" height="46" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
    <line x1="44" y1="86" x2="76" y2="86" stroke="#374151" stroke-width="2.5" marker-end="url(#arw)"/><text x="82" y="90" fill="#374151">数据流</text>
    <line x1="140" y1="86" x2="172" y2="86" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arwC)"/><text x="178" y="90" fill="#7c3aed">控制流</text>
    <line x1="238" y1="86" x2="270" y2="86" stroke="#059669" stroke-width="2" marker-end="url(#arwG)"/><text x="276" y="90" fill="#059669">重填/访存</text>
    <rect x="560" y="79" width="14" height="14" fill="#fffbeb" stroke="#b45309" stroke-width="3"/><text x="580" y="90" fill="#b45309" font-weight="600">★ 独有/标志</text>
    <text x="44" y="110" fill="#6b7280" font-weight="600">灰虚线 = 未公开：除实测数字外，前端/乱序引擎规格与 RAS 防御矩阵全部黑盒，图上不臆造</text>
  </g>

