# ============================================================================
# ooo-w84-int-decode.yaml — W8.4 Int Decode 备产 batch umbrella
#
# Prepared 2026-09-25 at repo HEAD 6990ef2e (W7.4 mechanism f89f44b6 +
# wiring 6990ef2e; 91/91 D rows implemented). NOT RUN — M2 gate
# (W8.1, D25/D28 x CoreMark/Embench x F0 n=2000) must pass before any
# W8.2+ production launch. This file is PREPARATION ONLY.
#
# Scope: D01-D10 (10 D rows). Cell accounting vs
# docs/gem5-fi/ooo/05-expanded-matrix.csv (226 cells total):
#   covered by subcampaigns : 40
#   covered via alias (merge口径): 0
#   SVE-deferred (D78-D82)  : 0
#   M2-gate (W8.1, other agent): 0
#   total in scope          : 40
#
# WHY SUBCAMPAIGNS: tools/campaign.py binds ONE injector + ONE workload
# binary per campaign, and its grid is a Cartesian product (paired axes
# are not expressible). The minimal honest granularity is therefore
# (D row x workload binary) — each subcampaign below is a COMPLETE,
# campaign.py-runnable stanza. To run one:
#
#   python3 - <<'EOF'
#   import yaml
#   d = yaml.safe_load(open("campaigns/ooo-w84-int-decode.yaml"))
#   for i, sc in enumerate(d["subcampaigns"]):
#       print(i, sc["campaign_id"])
#   yaml.safe_dump(d["subcampaigns"][0], open("/tmp/sc.yaml", "w"),
#                   sort_keys=False)
#   EOF
#   python3 tools/campaign.py /tmp/sc.yaml --jobs 4
#
# --dry (manifests only, no gem5) is honored on both the two_phase and
# the legacy path.
#
# SEED SCHEME: base_seed = 84 * 1e6 + Dnum * 1000 + wl_idx * 10 —
# deterministic, collision-free across subcampaigns; the two_phase rule
# adds slot*100000 + rep (pilot slots 0-3, formal 10-13 by tier).
#
# TIER POLICY (02-doc six-step flow):
#   * F0-F3 cells: two_phase with the MATRIX-PINNED tier set of that
#     (D row x workload) group (the union of its E-rows' 适用频率 —
#     the matrix pins F0/F1/F2 per cell; NO E-row anywhere carries F3).
#     pilot_n 20, pick_top 2 (1 for single-tier), formal_n =
#     ceil(2000 / n_binaries) per binary (suite 均摊 ruling:
#     Embench 6 programs -> 334 each (total 2004); PolyBench 4 -> 500;
#     浮点子集/混合 2 -> 1000; single-binary -> 2000).
#     AMBIGUITY (documented, gap list): the W8 plan doc §2 words the
#     pilot as "tiers [F0,F1,F2,F3]x20" (02 doc step 1 generic wording)
#     while the expanded matrix pins per-cell tier sets and has no F3
#     rows — an F3 formal selection would be UNBACKFILLABLE (no E-row).
#     Default here = matrix-pinned set (every pilot/formal rep maps to
#     exactly one E-row, zero waste). To add the F3 cliff-probing pilot
#     arm anyway, append F3 to `tiers:` on the affected subcampaigns
#     (pilot results still land in tier_selection.json).
#   * F1（持续到运行结束）cells (drop_release): two_phase tiers [F1] —
#     the model is single-shot with persistent effect; the F1 tier clock
#     is the arm point. Documented decision.
#   * F5 cells: LEGACY single-pass (F4/F5 are not pilot-selectable,
#     campaign.py parse_two_phase), ooo.frequency_tier F5, n_per_cell
#     = the 均摊 formal count, trigger_value 1000 (standard arm clock).
#   * 事件触发 cells: LEGACY single-pass + counting block placeholder.
#     The density is deliberately NOT filled (W8.1 must produce
#     tools/event_density.py tables first) — campaign.py exits loudly
#     on those stanzas until `density:` lands. Never fabricate a count.
#
# BACKFILL: manifests carry ooo {design_unit_id, workload(<matrix 负载
# column string>), frequency_tier(per-rep)} — tools/backfill_expanded_
# matrix.py resolves E-ids via the D x F x workload unique lookup.
#============================================================================
